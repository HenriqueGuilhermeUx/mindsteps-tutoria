name: Build Android AAB and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        working-directory: client
        run: npm run typecheck

      - name: Install backend dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Validate backend build
        working-directory: server
        run: npm run build

      - name: Build web application
        working-directory: client
        env:
          VITE_API_URL: https://mindsteps-backend.onrender.com
          VITE_ENEM_V2_ENABLED: 'true'
        run: npm run build

      - name: Generate Android project
        working-directory: client
        run: npx cap add android

      - name: Set Android release version
        working-directory: client
        run: |
          test -f android/app/build.gradle || (echo "android/app/build.gradle not found" && exit 1)
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 7/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "2.3.0"/' android/app/build.gradle
          echo "Android release identity:"
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          grep -q 'versionCode 7' android/app/build.gradle || (echo "versionCode was not set to 7" && exit 1)
          grep -q 'versionName "2.3.0"' android/app/build.gradle || (echo "versionName was not set to 2.3.0" && exit 1)

      - name: Generate Android brand assets
        working-directory: client
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        working-directory: client
        run: npx cap sync android

      - name: Verify release version after sync
        working-directory: client
        run: |
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          grep -q 'versionCode 7' android/app/build.gradle || (echo "versionCode changed after cap sync" && exit 1)
          grep -q 'versionName "2.3.0"' android/app/build.gradle || (echo "versionName changed after cap sync" && exit 1)

      - name: Build installable debug APK and release bundle
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Rename test APK
        run: cp client/android/app/build/outputs/apk/debug/app-debug.apk MindSteps-2.3.0-vc7-teste.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MindSteps-2.3.0-vc7-Teste-APK
          path: MindSteps-2.3.0-vc7-teste.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mindsteps-upload-key.jks

      - name: Sign Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD secret is missing" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS secret is missing" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD secret is missing" && exit 1)
          jarsigner \
            -keystore mindsteps-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            client/android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs client/android/app/build/outputs/bundle/release/app-release.aab

      - name: Rename release bundle
        run: cp client/android/app/build/outputs/bundle/release/app-release.aab MindSteps-2.3.0-vc7.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MindSteps-2.3.0-vc7-Android-AAB
          path: MindSteps-2.3.0-vc7.aab
          if-no-files-found: error
          retention-days: 30
