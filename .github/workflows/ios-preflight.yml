name: MindSteps iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/ios-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 55
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing mobile app dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install temporary matching iOS platform
        run: npm install --no-save --no-package-lock --no-audit --no-fund @capacitor/ios@7.6.8
      - name: Compile MindSteps web assets
        run: npm run build
      - name: Generate native iOS platform
        run: npx cap add ios
      - name: Compile unsigned iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/mindsteps-derived" build 2>&1 | tee ios-build.log
      - name: Install and launch app in iPhone simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR="$RUNNER_TEMP/mindsteps-derived/Build/Products/Debug-iphonesimulator"
          APP_PATH="$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{let devices=Object.values(JSON.parse(x).devices).flat();let d=devices.find(v=>v.isAvailable&&v.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/mindsteps-tutoria-ios-launch.png"
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID" || true
      - name: Archive simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshot
          path: ${{ runner.temp }}/mindsteps-tutoria-ios-launch.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindsteps-ios-build-log
          path: client/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unsigned simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindsteps-ios-simulator-app
          path: ${{ runner.temp }}/mindsteps-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
