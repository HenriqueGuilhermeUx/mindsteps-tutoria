name: MindSteps Responsible AI Safety
on:
  push:
    branches:
      - safety/central-ai-access-policy-20261110
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/mindsteps-safety-policy.yml'
      - 'docs/security/**'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/mindsteps-safety-policy.yml'
      - 'docs/security/**'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Policy regression tests
        run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build verification
        run: npm run build
